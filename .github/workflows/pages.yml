name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'peligames/**'
      - 'index.html'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public source
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble website and current downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/pelicanux/PeliGames/releases --paginate --slurp > "$RUNNER_TEMP/releases.json"
          node peligames/build.mjs --output "$RUNNER_TEMP/peligames-site" --releases "$RUNNER_TEMP/releases.json"
      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/peligames-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
